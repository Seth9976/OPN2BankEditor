name: Windows Debug Build  
  
on:  
  push:  
  workflow_dispatch:  
  
jobs:  
  build-win64-debug:  
    runs-on: windows-latest  
    defaults:  
      run:  
        shell: msys2 {0}  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Setup MSYS2  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: UCRT64  
          update: true  
          install: git mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt5-base mingw-w64-ucrt-x86_64-qt5-svg mingw-w64-ucrt-x86_64-qt5-tools mingw-w64-ucrt-x86_64-qt5-winextras mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-qwt-qt5  
  
      - name: Configure CMake Debug  
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_VENDORED_RTAUDIO=ON -DUSE_VENDORED_RTMIDI=ON -DUSE_RTAUDIO_WASAPI=ON  
  
      - name: Build  
        run: cmake --build build --parallel  
  
      - name: Deploy Qt dependencies  
        run: windeployqt-qt5 --debug --compiler-runtime build/opn2_bank_editor.exe
  
      - name: Copy translations and examples  
        run: mkdir -p build/translations && (cp -f build/*.qm build/translations/ || true) && cp -rf Bank_Examples build/  

      - name: Copy Qt runtime DLLs  
        run: cp -f /ucrt64/bin/libqwt-qt5.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libwinpthread-1.dll /ucrt64/bin/libzstd.dll /ucrt64/bin/zlib1.dll /ucrt64/bin/libdouble-conversion.dll /ucrt64/bin/libicudt78.dll /ucrt64/bin/libicuin78.dll /ucrt64/bin/libicuuc78.dll /ucrt64/bin/libpcre2-16-0.dll /ucrt64/bin/libharfbuzz-0.dll /ucrt64/bin/libpng16-16.dll /ucrt64/bin/libfreetype-6.dll /ucrt64/bin/libglib-2.0-0.dll /ucrt64/bin/libintl-8.dll /ucrt64/bin/libiconv-2.dll build/ || true
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: opn2_bank_editor-win64-debug  
          path: build/
