name: Windows Debug Build  
  
on:  
  push:  
  workflow_dispatch:  
  
jobs:  
  build-win64-debug:  
    runs-on: windows-latest  
    defaults:  
      run:  
        shell: msys2 {0}  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Setup MSYS2  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: UCRT64  
          update: true  
          install: git mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt5-base mingw-w64-ucrt-x86_64-qt5-svg mingw-w64-ucrt-x86_64-qt5-tools mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-qwt-qt5  
  
      - name: Configure CMake Debug  
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_VENDORED_RTAUDIO=ON -DUSE_VENDORED_RTMIDI=ON -DUSE_RTAUDIO_WASAPI=ON  
  
      - name: Build  
        run: cmake --build build --parallel  
  
      - name: Deploy Qt dependencies  
        run: windeployqt --debug --compiler-runtime build/opn2_bank_editor.exe  
  
      - name: Copy translations and examples  
        run: mkdir -p build/translations && (cp -f build/*.qm build/translations/ || true) && cp -rf Bank_Examples build/  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: opn2_bank_editor-win64-debug  
          path: build/
